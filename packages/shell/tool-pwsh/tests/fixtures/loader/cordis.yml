# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@akashx/akx-system-prompt'

- id: tools
  name: '@akashx/akx-tools'

- id: subprocess
  name: '@akashx/akx-subprocess-local'

- id: bash
  name: '@akashx/akx-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@akashx/akx-shell-env'

- id: tasks
  name: '@akashx/akx-jobs-local'

- id: tool-jobs
  name: '@akashx/akx-tool-jobs'

- id: tool-pwsh
  name: '@akashx/akx-tool-pwsh'
