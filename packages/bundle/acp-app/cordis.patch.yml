# The automation-only ACP application over akx-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@akashx/akx-acp-app'

    - id: acp
      name: '@akashx/akx-acp'
      inject: [acpAppStartup]
      config:
        provider: akashx-official
        model: akashx-v4-flash
