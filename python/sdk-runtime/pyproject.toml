[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "akx-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled akx CLI runtime for the AkashX Harness Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AkashX" }]

[project.urls]
Homepage = "https://github.com/akashx-ai/akx-harness"
Documentation = "https://github.com/akashx-ai/akx-harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/akashx-ai/akx-harness/issues"
Source = "https://github.com/akashx-ai/akx-harness"

[project.scripts]
akx = "akx_harness_runtime:main"

# Include the injected akx executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/akx_harness_runtime/runtime/akx-harness-sdk-runtime-*"]
exclude = ["src/akx_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/akx_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
