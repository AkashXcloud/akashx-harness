# Keyless generic ACP v1 control-surface patch over `akx --profile acp`.

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: acp
  name: '@akashx/akx-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js process.env.AKX_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
