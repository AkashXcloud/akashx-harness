# Keyless assembled-request snapshot for native AkashX image offload. The
# local provider endpoint is supplied by the snapshot test; the real attachment
# store and ACP bridge carry two uploaded images into one model request.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  config:
    apiKeyEnv: AKX_SNAPSHOT_API_KEY
    baseURL: !!js process.env.AKX_SNAPSHOT_BASE_URL
    thinking: disabled
    maxRequestFilesBytes: 92
    imageOffloadByteQuantum: 1
    models:
      - id: akashx-v4-flash-vision-exp
        contextWindow: 32768
        maxTokens: 1024
        inputModalities: [text, image]

- id: acp
  name: '@akashx/akx-acp'
  config:
    provider: akashx-official
    model: akashx-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js process.env.AKX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Keep answers brief and factual.

- id: attachment-local
  name: '@akashx/akx-attachment-local'
