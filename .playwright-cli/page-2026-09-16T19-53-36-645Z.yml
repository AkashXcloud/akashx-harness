            - generic [ref=e309]: "{\"financebench_id\":\"financebench_id_06741\",\"tool_used\":\"ov\",\"method\":\"Read Operating_Income and Revenue from fb_ov_income (P0=2020, P1=2019, P2=2018) and Depreciation_Amortization from fb_ov_cashflow for WALMART_2020_10K, verified both against verbatim filing chunks (Consolidated Statements of Income p.50, Consolidated Statements of Cash Flows p.56); computed unadjusted EBITDA = operating income + D&A, divided each year by total revenues, then averaged the three annual margins.\",\"answer\":\"6.2% (3-year average unadjusted EBITDA margin, FY2018-FY2020). FY2018: (20,437 + 10,529) / 500,343 = 6.19%; FY2019: (21,957 + 10,678) / 514,405 = 6.34%; FY2020: (20,568 + 10,987) / 523,964 = 6.02%; average = (6.1890 + 6.3442 + 6.0224) / 3 = 6.1852% -> 6.2%. All amounts in USD millions per the filing's '(Amounts in millions)' caption.\",\"provenance\":[{\"source\":\"financebench.fb_ov_income\",\"locator\":\"https_url LIKE '%WALMART_2020_10K%': Operating_Income_P0=20568, Operating_Income_P1=21957, Operating_Income_P2=20437; Revenue_P0=523964, Revenue_P1=514405, Revenue_P2=500343\",\"quote\":\"Walmart Inc.\\nConsolidated Statements of Income\\nFiscal Years Ended January 31,\\n(Amounts in millions, except per share data)\\n2020\\n2019\\n2018\\nRevenues:\\nNet sales\\n$\\n519,926\\n$\\n510,329\\n$\\n495,761\\nMembership and other income\\n4,038\\n4,076\\n4,582\\nTotal revenues\\n523,964\\n514,405\\n500,343\\nCosts and expenses:\\nCost of sales\\n394,605\\n385,301\\n373,396\\nOperating, selling, general and administrative expenses\\n108,791\\n107,147\\n106,510\\nOperating income\\n20,568\\n21,957\\n20,437\"},{\"source\":\"financebench.fb_ov_cashflow\",\"locator\":\"https_url LIKE '%WALMART_2020_10K%': Depreciation_Amortization_P0=10987, Depreciation_Amortization_P1=10678, Depreciation_Amortization_P2=10529\",\"quote\":\"Walmart Inc.\\nConsolidated Statements of Cash Flows\\nFiscal Years Ended January 31,\\n(Amounts in millions)\\n2020\\n2