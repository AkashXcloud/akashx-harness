# TypeScript SDK snapshot-record patch over `akx --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: !!js "process.env.AKX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@akashx/akx-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- id: session-log-akx
  name: '@akashx/akx-session-log-akx'
  config:
    enabled: true

- insert:
    - id: snapshot-message-feedback
      name: '@akashx/akx-message-feedback'
      disabled: !!js "process.env.AKX_SNAPSHOT_FEEDBACK !== '1'"
      config:
        maxNoteBytes: 1024
    - id: snapshot-feedback-producer
      name: './feedback-producer.mjs'
      disabled: !!js "process.env.AKX_SNAPSHOT_FEEDBACK !== '1'"
