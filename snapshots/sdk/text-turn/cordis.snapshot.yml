# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash

- id: session-log-akx
  name: '@akashx/akx-session-log-akx'
  config:
    enabled: true
