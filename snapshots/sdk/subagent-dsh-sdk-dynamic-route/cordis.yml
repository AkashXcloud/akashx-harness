# SDK-profile patch for a deterministic parent model that selects a route for
# a separate SDK child runtime. Both runtimes persist their request headers.

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: tool-subagent
  name: '@akashx/akx-tool-subagent'
  disabled: true

- id: sdk-jsonrpc-server
  name: '@akashx/akx-sdk-jsonrpc-server'
  disabled: true

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- insert:
    - id: mock-llm
      name: '../../../packages/subagent/subagent-akx-sdk/tests/fixtures/loader/mock-delegating-llm.ts'
      disabled: !!js process.env.AKX_SNAPSHOT !== 'record'

    - id: subagent-akx-sdk
      name: '@akashx/akx-subagent-akx-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.AKX_TEST_CHILD_PATCHES ?? '[]')
        akxHome: !!js process.env.AKX_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          AKX_TELEMETRY_DISABLED: '1'

    - id: subagent-model-selection-settings
      name: '@akashx/akx-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: tool-subagent-akx-sdk
      name: '../../../packages/subagent/subagent-akx-sdk/tests/fixtures/loader/scoped-tool-subagent.ts'
      config:
        provider: akx-sdk
        toolName: subagent
        enableRunInBackground: false
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    - id: sdk-jsonrpc-server-dynamic-live
      name: '@akashx/akx-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      disabled: !!js process.env.AKX_SNAPSHOT !== 'record'
      config:
        maxTokensAsSuccess: true
