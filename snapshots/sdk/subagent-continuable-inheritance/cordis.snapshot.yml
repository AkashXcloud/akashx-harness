# Keyless counterpart to subagent-continuable-inheritance.cordis.yml: replace
# the live adapter with replay and switch the root session to read-only at
# creation.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-flash

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: sandbox
  name: '@akashx/akx-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro
    - id: parent-sandbox-override
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-sandbox-override.ts'
