# TypeScript SDK snapshot patch for foreground and background AKX SDK failures.

- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: !!js "process.env.AKX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-log-akx
  name: '@akashx/akx-session-log-akx'
  config:
    enabled: true

- insert:
    - id: subagent-akx-sdk-diagnostic
      name: '@akashx/akx-subagent-akx-sdk'
      config:
        providerName: akx-sdk-diagnostic
        profile: sdk
        patches:
          - !!js process.env.AKX_TEST_CHILD_PATCH
        akxHome: !!js akxHomePath('children/foreground')
        provider: mock
        model: mock-echo
        env:
          AKX_TELEMETRY_DISABLED: '1'
          AKX_TEST_CHILD_FAILURE: '1'
    - id: tool-subagent-akx-sdk-diagnostic
      name: '@akashx/akx-tool-subagent'
      config:
        provider: akx-sdk-diagnostic
        toolName: subagent_akx_sdk
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: subagent-akx-sdk-diagnostic-background
      name: '@akashx/akx-subagent-akx-sdk'
      config:
        providerName: akx-sdk-diagnostic-background
        profile: sdk
        patches:
          - !!js process.env.AKX_TEST_CHILD_PATCH
        akxHome: !!js akxHomePath('children/background')
        provider: mock
        model: mock-echo
        env:
          AKX_TELEMETRY_DISABLED: '1'
          AKX_TEST_CHILD_FAILURE: '1'
          FAKE_INIT_GO: .akx-sdk-background-release
    - id: tool-subagent-akx-sdk-diagnostic-background
      name: '@akashx/akx-tool-subagent'
      config:
        provider: akx-sdk-diagnostic-background
        toolName: subagent_akx_sdk_background
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: release-akx-sdk-background-on-job-output
      name: '../../../apps/cli/tests/profiles/sdk/fixtures/subagent-akx-sdk-release-on-job-output.ts'
