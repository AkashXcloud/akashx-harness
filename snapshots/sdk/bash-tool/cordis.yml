# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: !!js "process.env.AKX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@akashx/akx-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1
