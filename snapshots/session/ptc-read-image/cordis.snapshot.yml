# Keyless replay combines PTC mode with the durable image store and an exact
# image-capable replay route. The scenario generates its tiny PNG inside the
# run_code program, then exercises read_image as a nested dispatch.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: plugin-package-inventory
  disabled: true

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@akashx/akx-tools'
  config:
    mode: ptc

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
                inputModalities: [text]
              - id: akashx-v4-pro
                inputModalities: [text]
              - id: akashx-v4-flash-vision-exp
                inputModalities: [text, image]

- id: attachment-local
  name: '@akashx/akx-attachment-local'
