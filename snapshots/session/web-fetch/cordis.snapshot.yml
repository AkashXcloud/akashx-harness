# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@akashx/akx-web'

- id: web-fetch-http
  name: '@akashx/akx-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@akashx/akx-tool-web'
  config:
    search: false
