# Keyless replay counterpart of system-prompt-in-history/cordis.yml: the
# replay route declares the same in-history capability.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-flash

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-flash
                systemPromptUpdate: in-history
                inputModalities: [text, image]
    - id: in-history-prompt-update
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/in-history-prompt-update.ts'
