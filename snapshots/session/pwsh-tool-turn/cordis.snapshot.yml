# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-pro

- id: subprocess
  name: '@akashx/akx-subprocess-local'

- id: bash-sandbox
  name: '@akashx/akx-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@akashx/akx-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@akashx/akx-shell-env'

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-pro

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@akashx/akx-goal'
  disabled: true

- id: goal-round-driver
  name: '@akashx/akx-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@akashx/akx-command-goal'
  disabled: true

- id: tool-goal
  name: '@akashx/akx-tool-goal'
  disabled: true

- id: skill
  name: '@akashx/akx-skill'
  disabled: true

- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@akashx/akx-tool-skill'
  disabled: true

- id: tool-bash
  name: '@akashx/akx-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@akashx/akx-tool-pwsh'
  disabled: false
