# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  config:
    models:
      - id: akashx-v4-pro

- id: subprocess
  name: '@akashx/akx-subprocess-local'

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-pro

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: !!js 'process.env.AKX_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@akashx/akx-tool-jobs'
  disabled: true

- id: goal
  name: '@akashx/akx-goal'
  disabled: true

- id: goal-round-driver
  name: '@akashx/akx-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@akashx/akx-command-goal'
  disabled: true

- id: tool-goal
  name: '@akashx/akx-tool-goal'
  disabled: true

- id: skill
  name: '@akashx/akx-skill'
  disabled: true

- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@akashx/akx-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@akashx/akx-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@akashx/akx-spill-local'
  config:
    root: !!js process.env.AKX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.AKX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.AKX_SNAPSHOT_SPILL_LOCATOR_ROOT
