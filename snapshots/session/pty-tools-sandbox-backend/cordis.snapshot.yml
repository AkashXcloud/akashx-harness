# Keyless replay counterpart to pty.cordis.yml.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: pty
      name: '@akashx/akx-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@akashx/akx-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro
