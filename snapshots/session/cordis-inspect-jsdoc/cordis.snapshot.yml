# Replay counterpart to advanced.cordis.yml; only the live model is replaced.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-flash

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@akashx/akx-tools'
  config:
    mode: both

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@akashx/akx-cordis-host-runner'
    - id: tool-cordis
      name: '@akashx/akx-tool-cordis'
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro
