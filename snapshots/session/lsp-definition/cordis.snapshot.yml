# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: lsp
      name: '@akashx/akx-lsp'
    - id: lsp-stdio
      name: '@akashx/akx-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@akashx/akx-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro

- id: timeout-policy
  name: '@akashx/akx-tool-call-timeout-policy'
