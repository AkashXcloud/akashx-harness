# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-pro

- insert:
    - id: terminal
      name: '@akashx/akx-terminal'

- id: sandbox-policy
  name: '@akashx/akx-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@akashx/akx-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@akashx/akx-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-pro

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.

- id: tool-jobs
  name: '@akashx/akx-tool-jobs'
  disabled: true

- id: goal
  name: '@akashx/akx-goal'
  disabled: true

- id: goal-round-driver
  name: '@akashx/akx-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@akashx/akx-command-goal'
  disabled: true

- id: tool-goal
  name: '@akashx/akx-tool-goal'
  disabled: true

- id: skill
  name: '@akashx/akx-skill'
  disabled: true

- id: skill-filesystem
  name: '@akashx/akx-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@akashx/akx-tool-skill'
  disabled: true

- id: tool-bash
  name: '@akashx/akx-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@akashx/akx-tool-pwsh-persistent'
