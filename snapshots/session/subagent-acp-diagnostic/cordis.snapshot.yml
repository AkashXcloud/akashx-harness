# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- insert:
    - id: acp-diagnostic-release-on-job-output
      name: './release-on-job-output.mjs'
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro
    - id: subagent-acp-diagnostic
      name: '@akashx/akx-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js "decodeURIComponent(new URL('../../../packages/subagent/subagent-acp/tests/mock-acp-server.ts', 'file://' + process.env.AKX_SNAPSHOT_FILE).pathname)"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
          MOCK_PROMPT_HOLD: .akx/acp-diagnostic-prompt-hold
    - id: tool-subagent-acp-diagnostic
      name: '@akashx/akx-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        backgroundMode: one-shot
        maxDepth: provider-managed
