# Keyless twin of subagent-result-diagnostic.cordis.yml: keep the same test
# provider/tool and replace only the external model adapter.
- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro
    - id: subagent-result-diagnostic
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-result-diagnostic.ts'
    - id: tool-subagent-codex
      name: '@akashx/akx-tool-subagent'
      config:
        provider: snapshot-diagnostic
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true
