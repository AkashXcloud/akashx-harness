# Keyless filesystem snapshots combine spill settings with replay. The
# sandboxed filesystem stack already lives in `akx-base`; the ACP row re-pins
# `akashx-v4-flash` for the recorded corpus.
- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: agent-default-model
  name: '@akashx/akx-agent-default-model'
  config:
    provider: akashx-official
    model: akashx-v4-flash

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js akxHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@akashx/akx-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@akashx/akx-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro

- id: spill-local
  name: '@akashx/akx-spill-local'
  config:
    root: !!js process.env.AKX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@akashx/akx-spill-policy'
  config:
    maxInlineBytes: 800

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.AKX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.AKX_SNAPSHOT_SPILL_LOCATOR_ROOT
