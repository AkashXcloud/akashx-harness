# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-akx
  name: '@akashx/akx-llm-akx'
  disabled: true

- id: acp
  name: '@akashx/akx-acp'
  config:
    provider: akashx-official
    model: akashx-v4-flash

- id: session-persistence-jsonl
  name: '@akashx/akx-session-persistence-jsonl'
  config:
    root: !!js process.env.AKX_SNAPSHOT_SESSIONS_ROOT ?? akxHomePath('sessions')
    compression: none

- id: sandbox
  name: '@akashx/akx-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@akashx/akx-llm-replay'
      config:
        providers:
          - id: akashx-official
            name: AkashX
            models:
              - id: akashx-v4-flash
              - id: akashx-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/akx-escalated.txt && cat /tmp/akx-escalated.txt && rm /tmp/akx-escalated.txt"
        recordedPath: /tmp/akx-escalated.txt
        livePath: !!js process.env.AKX_SNAPSHOT_SPILL_ROOT + '/akx-escalated.txt'
